services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --queues=datasets
    depends_on:
      redis:
        condition: service_healthy
